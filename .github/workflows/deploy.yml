name: CI/CD Production pipeline

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps

      - name: Run backend tests
        run: npm run test --prefix backend --if-present

      - name: Run frontend tests
        run: npm test --prefix frontend --if-present

      - name: Check frontend for syntax errors
        run: npm run build --prefix frontend

  build-deploy:
    name: SIMBBiz Build and Deploy
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      # FIX 1: Move login and Buildx setup to the top before building
      - name: log in to docker hub
        uses: docker/login-action@v3 
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "divinewisdomorima/simbbiz"
          
      # FIX 2: One single step to build and push backend (Lowercase names & 'file:' input)
      - name: build and push backend image
        uses: docker/build-push-action@v5 
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/simbbiz-backend:build-${{ github.run_number }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/simbbiz-backend:${{ github.sha }}

      # FIX 3: One single step to build and push frontend (Lowercase names & 'file:' input)
      - name: build and push frontend image 
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/simbbiz-frontend:build-${{ github.run_number }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/simbbiz-frontend:${{ github.sha }}

name: CI/CD Production pipeline

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps

      - name: Run backend tests
        run: npm run test --prefix backend --if-present

      - name: Run frontend tests
        run: npm test --prefix frontend --if-present

      - name: Lint backend code
        run: npm run lint --prefix backend --if-present

      - name: Lint frontend code
        run: npm run lint --prefix frontend --if-present

      - name: Check frontend for syntax errors
        run: npm run build --prefix frontend

  build-deploy:
    name: SIMBBiz Build and Deploy
    needs: test-and-validate # FIX: Prevents deployment if tests fail!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code # FIX: Crucial step so Docker can find files!
        uses: actions/checkout@v4

      - name: Build Backend Image
        uses: docker/build-push-action@v5 # Updated to v5 for stability
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile # Explicitly links backend Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:$(date-%Y%m%d%H%M%S),${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:${{ github.sha }}

      - name: Build Frontend Image 
        uses: docker/build-push-action@v5 # Updated to v5 for stability
        with:
          context: ./frontend 
          dockerfile: ./frontend/Dockerfile # Explicitly links frontend Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:$(date-%Y%m%d%H%M%S),${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # Updated to v3 for stability
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Updated to v3 for stability

      - name: push Backend Image
        uses: docker/build-push-action@v5 # Updated to v5 for stability
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile # Explicitly links backend Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:$(date-%Y%m%d%H%M%S),${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:${{ github.sha }}

      - name:  push Frontend Image 
        uses: docker/build-push-action@v5 # Updated to v5 for stability
        with:
          context: ./frontend 
          dockerfile: ./frontend/Dockerfile # Explicitly links frontend Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:$(date-%Y%m%d%H%M%S),${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:${{ github.sha }}

name: CI/CD Production pipeline

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps

      - name: Run backend tests
        run: npm run test --prefix backend --if-present

      - name: Run frontend tests
        run: npm test --prefix frontend --if-present

      # - name: Lint backend code
      #   run: npm run lint --prefix backend --if-present

      # - name: Lint frontend code
      #   run: npm run lint --prefix frontend --if-present

      - name: Check frontend for syntax errors
        run: npm run build --prefix frontend

  build-deploy:
    name: SIMBBiz Build and Deploy
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile 
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:build-${{github.run_number}},${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:${{ github.sha }}

      - name: build frontend image 
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          dockerfile: ./frontend/Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:build-${{github.run_number}},${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:${{ github.sha }}

      - name: log in to docker hub
        uses: docker/login-action@v3 
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: push backend image
        uses: docker/build-push-action@v5 
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:build-${{github.run_number}},${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-backend:${{ github.sha }}

      - name:  push frontend image 
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:build-${{github.run_number}},${{ secrets.DOCKER_HUB_USERNAME }}/SIMBBiz-frontend:${{ github.sha }}

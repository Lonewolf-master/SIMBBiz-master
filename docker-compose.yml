version: '3.8'
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    # Docker containers automatically have outbound internet access by default,
    # so they can natively connect to your MongoDB Atlas cluster.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
